name: Validate community stickers
on:
  pull_request:
    paths:
      - 'assets/plugins/astrbot_plugin_dafeiyu_stickers/community/**'
      - 'assets/plugins/astrbot_plugin_dafeiyu_stickers/custom_catalog.py'
      - 'build/validate_community_stickers.py'
      - '.github/workflows/community-stickers.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install pillow==13.0.0
      - run: python build/validate_community_stickers.py
